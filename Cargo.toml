[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/scanner",
    "crates/project",
    "crates/constraints",
    "crates/graph",
    "crates/predictor",
    "crates/diagnosis",
    "crates/verifier",
    "crates/cli",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
authors = ["Axonel Team <team@axonel.io>"]
license = "Apache-2.0"
repository = "https://github.com/axonel/concord"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
semver = { version = "1.0", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
toml = "0.8"
walkdir = "2.5"
petgraph = { version = "0.6", features = ["serde-1"] }
sysinfo = "0.30"
tempfile = "3.10"
serde_yaml = "0.9"
